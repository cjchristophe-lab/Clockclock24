<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClockClock 24 — Horloge cinétique</title><style>
/* ============================================================
   ZONE PERSONNALISABLE — MODIFIE CES VALEURS DANS NOTEPAD++
   Couleurs au format #RRGGBB, dimensions en px, durées en secondes.
   ============================================================ */
:root {
  --clock-background: #111214; /* Fond général, thème noir */
  --clock-panel: #1c1e21;      /* Fond du panneau */
  --clock-border: #303237;     /* Contour des cadrans */
  --clock-hands: #f2eee7;      /* Couleur des 48 aiguilles */
  --clock-text: #e9e7e2;       /* Texte principal */
  --clock-muted: #8b8b8b;      /* Texte secondaire */
  --hand-length: 41%;          /* Petite aiguille : longueur d’origine */
  --long-hand-length: 49%;   /* Grande aiguille : atteint le bord interieur du cadran */
  --hand-thickness: 15px;       /* Épaisseur IDENTIQUE des deux aiguilles */
  --hand-thickness-mobile: 2px;/* Épaisseur sur téléphone */
  --dial-gap: clamp(2px,.4vw,6px); /* Espace entre cadrans */
  --panel-max-width: 1600px;   /* Largeur maximale de l'horloge taille de l'horloge: 1080px	Taille actuelle, 1200px	Un peu plus grande, 1400px	Grande, 1600px	Très grande */  
  --rotation-duration: 2.0s;   /* Durée de rotation des aiguilles */
}
/* FIN DE LA ZONE PERSONNALISABLE CSS */

:root{color-scheme:dark;--bg:var(--clock-background);--fg:var(--clock-text);--face:var(--clock-panel);--rim:var(--clock-border);--hand:var(--clock-hands);--muted:var(--clock-muted)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background .4s,color .4s}header{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(18px,4vw,64px);gap:20px}.brand{font-weight:650;letter-spacing:.2em;font-size:13px}.sub{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:6px}main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px 65px}.panel{width:min(94vw,var(--panel-max-width));padding:clamp(14px,3vw,38px);border:1px solid var(--rim);background:var(--face);box-shadow:0 28px 80px #0004;border-radius:8px}.clock-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:var(--dial-gap)}.dial{width:100%;aspect-ratio:1;border:1px solid var(--rim);border-radius:50%;position:relative;overflow:hidden;background:var(--bg);box-shadow:inset 0 2px 7px #0002}.dial:after{content:'';position:absolute;top:50%;left:50%;width:5px;height:5px;border-radius:50%;background:var(--hand);transform:translate(-50%,-50%);z-index:3}.hand{position:absolute;left:50%;top:calc(50% - var(--hand-thickness) / 2);height:var(--hand-thickness);width:var(--long-hand-length);background:var(--hand);border-radius:3px;transform-origin:0 50%;transition:transform var(--rotation-duration) cubic-bezier(.22,.7,.16,1);box-shadow:0 0 2px #0005}.hand.second{width:var(--hand-length);height:var(--hand-thickness);opacity:1}.dial.inactive .hand{opacity:var(--inactive-hand-opacity)}.dial.inactive:after{opacity:.12}.toolbar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:0 16px 28px}button{background:transparent;color:var(--fg);border:1px solid var(--rim);padding:10px 15px;border-radius:6px;cursor:pointer;font:inherit}button:hover{background:var(--rim)}button.active{background:var(--fg);color:var(--bg)}footer{text-align:center;color:var(--muted);padding:0 12px 24px;font-size:12px}.light{--bg:#f4f2ed;--fg:#252525;--face:#fff;--rim:#d9d6d0;--hand:#222;--muted:#777}.warm{--bg:#201b18;--fg:#ead9bb;--face:#302820;--rim:#514335;--hand:#e8b777;--muted:#b9a18b}@media(max-width:600px){header{padding:18px}main{padding:12px 8px 35px}.panel{width:100%;padding:8px}.clock-grid{gap:3px}.hand{height:var(--hand-thickness-mobile);top:calc(50% - var(--hand-thickness-mobile) / 2)}.hand.second{height:var(--hand-thickness-mobile)}.dial:after{width:3px;height:3px}}
/* Masquer le point central sur les 24 cadrans */
.dial::after { display: none !important; }


/* ========================================
   ADAPTATION AUTOMATIQUE AUX ÉCRANS
   ======================================== */

/* PC : taille maximale de l'horloge */
.panel {
    width: min(94vw, var(--panel-max-width));
    max-width: 100%;
    box-sizing: border-box;
}

/* TABLETTE : écran inférieur à 900px */
@media screen and (max-width: 900px) {
    .panel {
        width: 98vw;
    }
}

/* MOBILE : écran inférieur à 600px */
@media screen and (max-width: 600px) {
    .panel {
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
    }

    .grid {
        width: 100%;
        min-width: 0;
    }

    :root {
        --dial-gap: 2px;             /* Espacement des cadrans */
        --hand-thickness: 2px;       /* Épaisseur des aiguilles */
    }
}
</style></head><body><header><div><div class="brand">CLOCKCLOCK <span style="font-weight:300">24</span></div><div class="sub">design by jc</div></div><div id="time" aria-live="off" style="font-variant-numeric:tabular-nums;letter-spacing:.12em"></div></header><main><div class="panel"><div class="clock-grid" id="grid" role="img" aria-label="Horloge artistique affichant l'heure actuelle"></div></div></main><div class="toolbar"><button id="dark" class="active">Noir</button><button id="light">Blanc</button><button id="warm">Cuivre</button><button id="art">Animation artistique</button><button id="full">⛶ Plein écran</button></div><footer>24 cadrans · 48 aiguilles · Heure locale en direct · Création web indépendante inspirée de l'art cinétique</footer><script>
/* ============================================================
   PARAMÈTRES FACILES À MODIFIER DANS NOTEPAD++
   Change uniquement les valeurs à droite des deux-points.
   ============================================================ */
const REGLAGES = {
  afficherSecondes: true,       // true = HH:MM:SS en haut ; false = HH:MM
  animationArtistiqueAuDemarrage: true, // true = chorégraphies activées au démarrage
  intervalleArtistique: 25000,   // Temps entre animations artistiques en millisecondes
  retourApresAnimation: 4200,    // Retour à l'heure après une animation (millisecondes)
  themeInitial: 'light'           // 'dark' = noir, 'light' = blanc, 'warm' = cuivre
};
/* FIN DES PARAMÈTRES PERSONNALISABLES */

// ============================================================
// HORLOGE : chaque chiffre = 2 colonnes x 3 lignes de cadrans.
// Les cadrans non utilisés pour un chiffre sont atténués.
// 0=droite, 90=bas, 180=gauche, 270=haut.
// ============================================================
const C={TR:[0,90],TL:[90,180],BR:[270,0],BL:[180,270],H:[0,180],V:[90,270],NE:[0,270],SE:[0,90],SW:[90,180],NW:[180,270]};
// UN SEUL TRAIT : les deux aiguilles se superposent EXACTEMENT.
// Pour le chiffre 1 : haut = bas, milieu = verticale entiere, bas = haut.
// Pour le chiffre 4 : les deux cadrans du haut = bas ; angle au milieu ; bas droite = haut.
// Pour tous les chiffres : les traits terminaux sont superposes,
// les traits qui traversent un cadran restent opposes (180 deg),
// et les coins utilisent deux directions perpendiculaires.
// 0 = droite, 90 = bas, 180 = gauche, 270 = haut.
// Contrairement a [0,180], [0,0] ne dessine qu'une demi-ligne.
const TRAIT_DROITE=[0,0], TRAIT_GAUCHE=[180,180];
const TRAIT_BAS=[90,90], TRAIT_HAUT=[270,270]; // Deux aiguilles exactement superposees
const OFF=null;
const glyphs={
 '0':[[C.SE,C.SW],[C.V,C.V],[C.NE,C.NW]],
 '1':[[OFF,TRAIT_BAS],[OFF,C.V],[OFF,TRAIT_HAUT]],
 '2':[[TRAIT_DROITE,C.SW],[C.SE,C.NW],[C.NE,TRAIT_GAUCHE]],
 '3':[[TRAIT_DROITE,C.SW],[TRAIT_DROITE,C.V],[TRAIT_DROITE,C.NW]],
 '4':[[TRAIT_BAS,TRAIT_BAS],[C.NE,C.SW],[OFF,TRAIT_HAUT]],
 '5':[[C.SE,TRAIT_GAUCHE],[C.NE,C.SW],[TRAIT_DROITE,C.NW]],
 '6':[[C.SE,TRAIT_GAUCHE],[C.V,C.SW],[C.NE,C.NW]],
 '7':[[TRAIT_DROITE,C.SW],[OFF,C.V],[OFF,TRAIT_HAUT]],
 '8':[[C.SE,C.SW],[C.SE,C.SW],[C.NE,C.NW]],
 '9':[[C.SE,C.SW],[C.NE,C.V],[TRAIT_DROITE,C.NW]]
};
const grid=document.getElementById('grid'),hands=[],dials=[];
for(let i=0;i<24;i++){
 const d=document.createElement('div');d.className='dial';dials.push(d);
 const pair=[];
 for(let j=0;j<2;j++){
  const h=document.createElement('div');h.className='hand'+(j?' second':'');
  d.appendChild(h);pair.push({el:h,angle:0});
 }
 grid.appendChild(d);hands.push(pair);
}
let artistic=REGLAGES.animationArtistiqueAuDemarrage;
let lastMinute=-1,artTimer=null,returnTimer=null,animating=false,sequence=0;
function move(hand,target,extraTurns=0){
 const a=((hand.angle%360)+360)%360;
 let delta=((target-a+540)%360)-180;
 if(delta===-180)delta=180;
 hand.angle+=delta+extraTurns*360;
 hand.el.style.transform=`rotate(${hand.angle}deg)`;
}
function render(){
 clearTimeout(returnTimer);animating=false;
 const now=new Date();
 const digits=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}).replace(':','');
 grid.setAttribute('aria-label','Il est '+digits.slice(0,2)+' heures '+digits.slice(2));
 const patterns=digits.split('').map(x=>glyphs[x]);
 for(let r=0;r<3;r++)for(let c=0;c<8;c++){
  const idx=r*8+c;
  const position=Math.floor(c/2);
  const chiffre=digits[position];
  let cell=patterns[position][r][c%2];
  // Exception 01 h : 0 sur colonnes 2 et 3, 1 sur colonne 4.
  if(digits.slice(0,2)==='01' && c<=2){
   cell=c===0 ? OFF : glyphs['0'][r][c-1];
  }
  // Seul le 1 des unités des minutes (4e chiffre) passe dans la colonne gauche.
  if(position===3 && chiffre==='1'){
   cell=c%2===0 ? [TRAIT_BAS,C.V,TRAIT_HAUT][r] : OFF;
  }
  dials[idx].classList.toggle('inactive',cell===OFF);
  const angles=cell||[45,225];
  move(hands[idx][0],angles[0]);move(hands[idx][1],angles[1]);
 }
 lastMinute=now.getHours()*60+now.getMinutes();
}
// Trois choregraphies originales : vague, spirale, synchronisation.
function flourish(){
 if(!artistic||animating||document.hidden)return;
 animating=true;
 const mode=sequence++%3;
 dials.forEach(d=>d.classList.remove('inactive'));
 hands.forEach((pair,i)=>pair.forEach((h,j)=>{
  let angle,turns;
  if(mode===0){angle=(i%8)*45+(j?90:0);turns=1+(Math.floor(i/8)%2);}
  else if(mode===1){const x=i%8-3.5,y=Math.floor(i/8)-1;angle=Math.atan2(y,x)*180/Math.PI+(j?180:0);turns=1;}
  else {angle=(j?270:90);turns=1+(i%3===0?1:0);}
  move(h,angle,turns);
 }));
 returnTimer=setTimeout(render,REGLAGES.retourApresAnimation);
}
function tick(){
 const now=new Date(),minute=now.getHours()*60+now.getMinutes();
 document.getElementById('time').textContent=now.toLocaleTimeString('fr-FR',REGLAGES.afficherSecondes?{}:{hour:'2-digit',minute:'2-digit'});
 if(minute!==lastMinute)render(); // priorite a l'heure exacte
}
function theme(t){
 document.body.className=t==='dark'?'':t;
 for(const k of ['dark','light','warm'])document.getElementById(k).classList.toggle('active',k===t);
}
function scheduleArt(){
 clearInterval(artTimer);
 if(artistic)artTimer=setInterval(flourish,Math.max(8000,REGLAGES.intervalleArtistique));
 if(document.getElementById('art'))document.getElementById('art').classList.toggle('active',artistic);
 if(!artistic)render();
}
for(const t of ['dark','light','warm'])document.getElementById(t).onclick=()=>theme(t);
document.getElementById('art').onclick=()=>{artistic=!artistic;scheduleArt()};
document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
theme(REGLAGES.themeInitial);render();scheduleArt();setInterval(tick,1000);
</script></body></html>
