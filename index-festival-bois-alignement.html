<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClockClock 24 — Festival XXL</title><style>
/* ============================================================
   ZONE PERSONNALISABLE — MODIFIE CES VALEURS DANS NOTEPAD++
   Couleurs au format #RRGGBB, dimensions en px, durées en secondes.
   ============================================================ */
:root {
  --clock-background: #111214; /* Fond général, thème noir */
  --clock-panel: #1c1e21;      /* Fond du panneau */
  --clock-border: #303237;     /* Contour des cadrans */
  --clock-hands: #f2eee7;      /* Couleur des 48 aiguilles */
  --clock-text: #e9e7e2;       /* Texte principal */
  --clock-muted: #8b8b8b;      /* Texte secondaire */
  --hand-length: 41%;          /* Petite aiguille : longueur d’origine */
  --long-hand-length: 46%;   /* Grande aiguille : atteint le bord interieur du cadran */
  --hand-thickness: 15px;       /* Épaisseur IDENTIQUE des deux aiguilles */
  --hand-thickness-mobile: 2px;/* Épaisseur sur téléphone */
  --dial-gap: clamp(2px,.4vw,6px); /* Espace entre cadrans */
  --panel-max-width: 1600px;   /* Largeur maximale de l'horloge */
  --inactive-hand-opacity: 1; /* Aiguilles des cadrans inactifs */
  --rotation-duration: 2.0s;   /* Durée de rotation des aiguilles */
}
/* FIN DE LA ZONE PERSONNALISABLE CSS */

:root{color-scheme:dark;--bg:var(--clock-background);--fg:var(--clock-text);--face:var(--clock-panel);--rim:var(--clock-border);--hand:var(--clock-hands);--muted:var(--clock-muted)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background .4s,color .4s}header{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(18px,4vw,64px);gap:20px}.brand{font-weight:650;letter-spacing:.2em;font-size:13px}.sub{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:6px}main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px 65px}.panel{width:min(94vw,var(--panel-max-width));padding:clamp(14px,3vw,38px);border:1px solid var(--rim);background:var(--face);box-shadow:0 28px 80px #0004;border-radius:8px}.clock-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:var(--dial-gap)}.dial{width:100%;aspect-ratio:1;border:1px solid var(--rim);border-radius:50%;position:relative;overflow:hidden;background:var(--bg);box-shadow:inset 0 2px 7px #0002}.dial:after{content:'';position:absolute;top:50%;left:50%;width:5px;height:5px;border-radius:50%;background:var(--hand);transform:translate(-50%,-50%);z-index:3}.hand{position:absolute;left:50%;top:calc(50% - var(--hand-thickness) / 2);height:var(--hand-thickness);width:var(--long-hand-length);background:var(--hand);border-radius:3px;transform-origin:0 50%;transition:transform var(--rotation-duration) cubic-bezier(.22,.7,.16,1);box-shadow:0 0 2px #0005}.hand.second{width:var(--hand-length);height:var(--hand-thickness);opacity:1}.dial.inactive .hand{opacity:var(--inactive-hand-opacity)}.dial.inactive:after{opacity:.12}.toolbar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:0 16px 28px}button{background:transparent;color:var(--fg);border:1px solid var(--rim);padding:10px 15px;border-radius:6px;cursor:pointer;font:inherit}button:hover{background:var(--rim)}button.active{background:var(--fg);color:var(--bg)}footer{text-align:center;color:var(--muted);padding:0 12px 24px;font-size:12px}.light{--bg:#f4f2ed;--fg:#252525;--face:#fff;--rim:#d9d6d0;--hand:#222;--muted:#777}.warm{--bg:#201b18;--fg:#ead9bb;--face:#302820;--rim:#514335;--hand:#e8b777;--muted:#b9a18b}@media(max-width:600px){header{padding:18px}main{padding:12px 8px 35px}.panel{width:100%;padding:8px}.clock-grid{gap:3px}.hand{height:var(--hand-thickness-mobile);top:calc(50% - var(--hand-thickness-mobile) / 2)}.hand.second{height:var(--hand-thickness-mobile)}.dial:after{width:3px;height:3px}}
/* ============================================================
   FESTIVAL XXL — réglages faciles
   ============================================================ */
:root {
  --neon-cyan: #36eaff;      /* Couleur principale */
  --neon-pink: #ff46c7;      /* Couleur secondaire */
  --neon-strength: 0.35;     /* Halo minimum, de 0 à 1 */
  --music-energy: 0;         /* Modifié automatiquement par la musique */
  --music-bass: 0;
}
body.neon { --bg:#050713; --face:#0b1023; --rim:#293451; --hand:var(--neon-cyan); --fg:#d9faff; --muted:#8095b7; }
body.neon .panel { border-color:#334568; box-shadow:0 0 38px rgba(25,140,240,.14),0 28px 80px #0009; }
body.neon .dial { border-color:#35476e; box-shadow:inset 0 0 10px #173f7b40,0 0 9px rgba(35,150,255,.13); }
body.neon .dial .hand { background:var(--neon-cyan); box-shadow:0 0 5px var(--neon-cyan),0 0 calc(9px + var(--music-bass) * 18px) var(--neon-cyan); }
body.neon .dial .hand.second { background:var(--neon-pink); box-shadow:0 0 5px var(--neon-pink),0 0 calc(8px + var(--music-energy) * 20px) var(--neon-pink); }
body.neon .dial.inactive .hand { opacity:var(--inactive-hand-opacity); }
body.neon .panel { filter:brightness(calc(1 + var(--music-bass) * .38)); }
body.neon .dial.beat { border-color:var(--neon-pink); box-shadow:0 0 calc(4px + var(--music-bass) * 18px) #ff46c780,inset 0 0 8px #ff46c744; }
body.neon button.active { background:#123a56; border-color:var(--neon-cyan); color:#dffbff; }
#music-status { text-align:center; min-height:22px; padding:0 12px 9px; font-size:12px; color:var(--muted); }
#meter { width:140px;height:5px; background:#23314a;border-radius:8px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px; }
#meter-fill { display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pink));transition:width .08s linear; }
@media (max-width:600px) {
  .panel { width:min(98vw,var(--panel-max-width));padding:clamp(3px,1.5vw,8px); }
  .clock-grid { gap:clamp(1px,.4vw,3px); }
  header { padding:12px; }
  main { padding:8px 2px 20px; }
  .toolbar { padding:0 8px 14px;gap:5px; }
  button { padding:8px 10px;font-size:12px; }
}
/* Masquer le point central sur les 24 cadrans */
.dial::after { display: none !important; }

/* FESTIVAL : contrôles et effets supplémentaires */
.festival-controls{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:0 12px 16px;color:var(--muted)}
.festival-controls select{background:var(--face);color:var(--fg);border:1px solid var(--rim);padding:8px;border-radius:6px}.festival-controls input{accent-color:#36eaff;width:110px}
body.neon .dial.festival-lit{border-color:hsl(var(--hue) 100% 65%);box-shadow:0 0 calc(5px + var(--pulse)*22px) hsl(var(--hue) 100% 60% / .7)}
body.neon .dial.festival-color .hand{background:hsl(var(--hue) 100% 65%);box-shadow:0 0 12px hsl(var(--hue) 100% 60%)}
body.neon .dial.festival-color .hand.second{background:hsl(calc(var(--hue) + 65) 100% 70%)}
body.neon .panel.drop{box-shadow:0 0 55px #ff46c780}
body.dj-active .hand{transition-duration:.55s}
@media(max-width:600px){.festival-controls{font-size:12px;gap:6px}}

/* XXL : mouvement continu et halos musicaux */
body.dj-active .hand{transition:none;will-change:transform}
body.neon .dial.festival-lit{border-color:hsl(var(--hue) 100% 70%);box-shadow:0 0 calc(4px + var(--pulse)*32px) hsl(var(--hue) 100% 60% / .85),inset 0 0 calc(var(--pulse)*20px) hsl(var(--hue) 100% 55% / .35)}
body.neon .dial.festival-color .hand{box-shadow:0 0 5px currentColor,0 0 calc(8px + var(--pulse)*22px) hsl(var(--hue) 100% 60%)}
body.neon .panel.drop{box-shadow:0 0 65px #b04cff88}
body.neon .panel{filter:none}

/* PLEIN ÉCRAN IMMERSIF : uniquement les 24 cadrans. Échap pour quitter. */
html:fullscreen .toolbar, html:fullscreen .festival-controls,
html:fullscreen #music-status, html:fullscreen footer, html:fullscreen header { display:none !important; }
html:fullscreen body { min-height:100vh; height:100vh; overflow:hidden; }
html:fullscreen main { padding:0; min-height:0; }
html:fullscreen .panel { width:min(98vw,var(--panel-max-width),220vh); }

/* Finitions bois : texture procédurale intégrée, sans Internet. */
body:is(.oak,.walnut,.bamboo,.rustic) .panel{background-image:linear-gradient(110deg,#fff2,transparent 45%,#0002),var(--wood-image);background-size:cover;border:2px solid #0005;border-radius:5px;box-shadow:inset 0 2px 3px #fff5,inset 0 -4px 6px #0005,0 12px 0 -4px #33271d,0 30px 55px #0009;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial{background-image:linear-gradient(145deg,#0003,#0000 70%,#fff2),var(--wood-image);background-size:cover;border:1px solid #0006;box-shadow:inset 3px 5px 9px #0008,inset -2px -2px 4px #fff3,0 1px 1px #fff5;}
body:is(.oak,.walnut,.bamboo,.rustic) .hand{background:linear-gradient(#34312e,#141210);box-shadow:1px 2px 3px #0007;}
body.walnut .hand{background:linear-gradient(#39332c,#100e0c);}

/* Bois : veinage continu, profondeur et éclairage doux. */
body:is(.oak,.walnut,.bamboo,.rustic) .panel{background-size:100% 100%;border:1px solid #39291c99;border-radius:9px;box-shadow:inset 0 1px 2px #fff7,inset 0 -3px 4px #0005,0 7px 0 #493522,0 9px 0 #2b2018,0 24px 40px #0008;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial{background-size:100% 100%,800% 300%;background-position:center,var(--grain-x,0%) var(--grain-y,0%);border:2px solid #30201388;box-shadow:inset 2px 5px 9px #0009,inset -2px -2px 3px #fff3,0 1px 1px #fff6;}
body:is(.oak,.walnut,.bamboo,.rustic) .hand{background:linear-gradient(180deg,#46423d 0%,#24211e 25%,#141311 85%,#0d0c0b);box-shadow:1px 3px 3px #0009;border-radius:2px;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial:nth-child(1){--grain-x:0.000%;--grain-y:0%;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial:nth-child(2){--grain-x:14.286%;--grain-y:0%;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial:nth-child(3){--grain-x:28.571%;--grain-y:0%;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial:nth-child(4){--grain-x:42.857%;--grain-y:0%;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial:nth-child(5){--grain-x:57.143%;--grain-y:0%;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial:nth-child(6){--grain-x:71.429%;--grain-y:0%;}
body:is(.oak,.walnut,.bamboo,.rustic) .dial:nth-child(7){--grain-x:85.714%;--grain-y:0%;}

document.getElementById('art').onclick=()=>{artistic=!artistic;scheduleArt()};
document.getElementById('full').onclick=async()=>{
  try { if(document.fullscreenElement) await document.exitFullscreen(); else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); else alert('Plein écran non disponible dans ce navigateur.'); }
  catch(e){ console.warn('Plein écran :',e); }
};
// Double-clic sur l’horloge pour quitter le plein écran, en plus de la touche Échap.
grid.addEventListener('dblclick',()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});});
theme(REGLAGES.themeInitial);render();scheduleArt();setInterval(tick,1000);
